{% extends "layout.html" %}
{% block main %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Type</th><th>Symbol</th><th>Price</th><th>Shares</th><th>Time</th>
        </tr>
    </thead>
    <tbody>
        {% for t in transactions %}
        <tr>
            <td>{{ t.type }}</td>
            <td>{{ t.symbol }}</td>
            <td>{{ t.price | usd }}</td>
            <td>{{ t.shares }}</td>
            <td>{{ t.timestamp }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
