{% extends "layout.html" %}

{% block main %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Shares</th>
            <th>Price</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody>
        {% for stock in portfolio %}
        <tr>
            <td>{{ stock.symbol }}</td>
            <td>{{ stock.shares }}</td>
            <td>{{ stock.price | usd }}</td>
            <td>{{ stock.value | usd }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<table class="table table-striped">
    <tr>
        <td>Cash</td>
        <!-- Line 28: Add | usd -->
<tr>
    <td>Cash</td>
    <td>{{ cash | usd }}</td>
</tr>

<!-- Line 32: Add | usd -->
<tr>
    <td><strong>Total</strong></td>
    <td><strong>{{ grand_total | usd }}</strong></td>
</tr>
    </tr>
</table>
{% endblock %}
